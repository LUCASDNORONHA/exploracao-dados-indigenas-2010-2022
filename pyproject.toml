# Sistema utilizado para construir e instalar o projeto como pacote Python.
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"


# Metadados gerais do projeto.
[project]
name = "panorama-indigena-2010-2022-ibge"
version = "0.1.2"
description = """
Análise exploratória e explicativa da população indígena brasileira
entre 2010 e 2022, baseada nos Censos Demográficos do IBGE.
"""
readme = "README.md"
requires-python = ">=3.12"

authors = [
    { name = "Lucas Dias Noronha", email = "lucasdiasnoronha1998@gmail.com" },
]


# Bibliotecas importadas diretamente nas análises e no processamento dos dados.
#
# As dependências transitivas, como Shapely, PyProj, Pyogrio, ContourPy
# e Python Dateutil, serão resolvidas automaticamente pelo uv.lock.
dependencies = [
    # Manipulação e processamento de dados
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "pyarrow>=25.0.0",
    # Leitura e escrita de planilhas
    "openpyxl>=3.1.5",
    # Análise e visualização
    "matplotlib>=3.10.7",
    "seaborn>=0.13.2",
    # Processamento e análise geoespacial
    "geopandas>=1.1.4",
    "shapely>=2.1.2",
    "streamlit>=1.59.1",
    "plotly>=6.9.0",
]


# Ferramentas necessárias para desenvolver e executar os notebooks,
# mas que não constituem dependências funcionais da análise.
[dependency-groups]
dev = [
    "black",
    "flake8",
    "ipykernel>=7.0.1",
    "isort",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]


# Padronização automática do código.
[tool.black]
line-length = 88
target-version = ["py312"]


# Organização automática dos imports.
[tool.isort]
profile = "black"
line_length = 88
